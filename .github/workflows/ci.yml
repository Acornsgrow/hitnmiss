name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: RSpec (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.0'
          - '3.1'
          - '3.2'
          - '3.3'

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Cloudsmith
        uses: cloudsmith-io/cloudsmith-cli-action@v2
        with:
          oidc-namespace: acorns
          oidc-service-slug: ${{ secrets.CLOUDSMITH_OIDC_SLUG }}
          oidc-auth-only: 'true'

      - name: Configure Bundler for Cloudsmith
        run: echo "BUNDLE_PKG__ACORNS__COM=token:$CLOUDSMITH_API_KEY" >> "$GITHUB_ENV"

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run RSpec
        run: bundle exec rspec
